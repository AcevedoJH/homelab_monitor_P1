# ============================================================================
# security-headers.conf — Cabeceras de seguridad HTTP del frontend
# ----------------------------------------------------------------------------
# Este snippet se incluye desde nginx.conf en los locations de contenido
# estático (`/` y `/_astro/`). El location `/api/` NO lo incluye: el backend
# envía sus propias cabeceras con helmet (ver backend/src/app.js).
# El modificador `always` garantiza que las cabeceras se envíen en TODAS las
# respuestas, incluidas 4xx/5xx y los errores generados por nginx.
#
# Objetivo: calificación A+ en securityheaders.com y protección contra los
# ataques clásicos (clickjacking, MIME sniffing, XSS, robo de referer...).
# ============================================================================

# HSTS: obliga a HTTPS durante 1 año. Solo surte efecto sobre conexiones
# seguras (el sitio va detrás de Cloudflare Tunnel). includeSubDomains aplica
# a subdominios de este host. No usamos `preload`: requiere registro manual
# en el HSTS preload list y no lo hemos solicitado.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP: política estricta. El frontend es estático:
#   - script-src 'self'        → solo JS del propio origen (Astro empaqueta en
#                                /_astro/*.js; no hay scripts inline en el HTML).
#   - style-src 'self'         → CSS empaquetado por Astro.
#     'unsafe-inline'          → permitido SOLO para estilos inline (style=""):
#                                liveMetrics.js renderiza HTML con style y el
#                                browser también ejecuta estilos por atributo.
#   - img-src 'self' data:     → imágenes propias + favicon SVG inline (data URI).
#   - connect-src 'self'       → la API es misma origin (/api vía proxy nginx).
#   - frame-ancestors 'none'   → nadie puede embeker el dashboard (clickjacking).
#   - base-uri 'self'          → evita inyección de <base>.
#   - object-src 'none'        → sin plugins/embeds (Flash/Java/etc.).
#   - form-action 'self'       → formularios solo a la misma origin.
#   - upgrade-insecure-requests→ sube cualquier recurso http:// a https://.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Clickjacking: la más estricta (defensa legacy, además de frame-ancestors).
add_header X-Frame-Options "DENY" always;

# MIME sniffing: fuerza el Content-Type declarado por el servidor.
add_header X-Content-Type-Options "nosniff" always;

# XSS filter legacy. NOTA: OWASP recomienda desactivarlo (0) porque puede
# introducir fallos; se mantiene "1; mode=block" por requisito del proyecto.
# La protección real contra XSS la aporta la CSP (script-src 'self').
add_header X-XSS-Protection "1; mode=block" always;

# Referrer: envía solo el origen al saltar a otra origin (equilibrio
# privacidad/utilidad para enlaces externos del footer).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy: deniega los APIs potentes que el dashboard no usa
# (cámara, micrófono, geolocalización, pagos, USB).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
