# ============================================================================
# nginx.conf — Frontend (Astro static) + reverse proxy hacia el backend
# ----------------------------------------------------------------------------
# Sirve el build estático de Astro y reenvía la ruta /api al servicio interno
# `backend` (puerto 3000) sobre la red de Docker.
#
# Gracias a este proxy, el navegador siempre habla con la MISMA origin
# (el host donde viven frontend y backend). El frontend usa rutas relativas
# "/api/v1", por lo que no hay CORS entre usuarios y API.
#
# HARDENING HTTP (dos capas, sin duplicados):
#   - Las cabeceras de seguridad del FRONTEND viven en el snippet
#     /etc/nginx/snippets/security-headers.conf y se incluyen SOLO en los
#     locations que sirven contenido estático (`/` y `/_astro/`).
#   - El location `/api/` NO las incluye: las respuestas de la API ya llevan
#     su propio juego de cabeceras generado por helmet en el backend
#     (src/app.js). Evitamos duplicar cabeceras (ej. dos CSP) o enviar
#     valores en conflicto (ej. X-XSS-Protection 0 del backend vs 1 del nginx).
#
# GOTCHA de nginx: si un location define su propia `add_header`, NO hereda las
# del nivel superior. Por eso el snippet se incluye explícitamente en `/_astro/`
# (que define add_header Cache-Control). En `/` no hace falta re-incluir porque
# no define add_header propio y hereda... pero lo incluimos igualmente para que
# la lista de cabeceras viva en un único lugar y no dependa de la herencia.
# ============================================================================

# nginx corre con usuario sin privilegios (non-root): escucha en 8080
# (puerto >1024, no requiere bind root). El host lo expone en
# ${FRONTEND_PORT:-4321} mediante el mapeo de puertos del docker-compose.
server {
    listen 8080;
    server_name _;

    # Oculta la versión de nginx en el header Server (anti-fingerprinting).
    server_tokens off;

    # Raiz del sitio: el build estatico de Astro (copiado a /usr/share/nginx/html)
    root /usr/share/nginx/html;
    index index.html;

    # ================= Minimización de datos (RGPD / privacidad) =================
    # No hay log de acceso: esto evita registrar la IP del visitante en
    # /var/log/nginx y, por tanto, en los `docker logs` del contenedor. Solo
    # queda el error_log (necesario para depurar, sin IPs de visitantes).
    access_log off;
    # El frontend es estático y no usa sesiones: nunca propagamos cabeceras
    # Set-Cookie hacia el cliente, vengan de donde vengan (defensa en profundidad).
    proxy_hide_header Set-Cookie;

    # Gzip para las respuestas textuales (HTML/JS/CSS/JSON)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ------------------ Peticiones a la API ------------------
    # Todo lo que empiece por /api se envia al backend Express de Node.
    # Usamos el nombre de servicio de docker-compose (backend) como nombre
    # de host interno gracias a la red definida en el compose.
    # NOTA: sin add_header de seguridad aquí a propósito: la API ya emite sus
    # propias cabeceras con helmet (ver backend/src/app.js).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    # ------------------ Archivos estaticos ------------------
    # Para rutas que no matchean un archivo, caemos a index.html
    # (Astro es static multi-page: las rutas reales son /index.html, etc.)
    location / {
        try_files $uri $uri/ /index.html;
        # Cabeceras de seguridad HTTP del frontend (HTML, JS, CSS, favicon).
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cachear assetos estaticos con versionado (hashes de Astro en _astro/).
    # IMPORTANTE: al definir add_header propio en este location, nginx NO
    # hereda las del nivel superior; por eso re-incluimos el snippet aquí.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
