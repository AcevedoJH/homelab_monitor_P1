# ============================================================================
# docker-compose.yml — Homelab Monitor
# ----------------------------------------------------------------------------
# Levanta la aplicación completa con UN SOLO COMANDO:
#
#     docker compose up -d
#
# Arquitectura de red:
#   - Red interna `monitor-net`: frontend y backend se ven entre sí por el
#     nombre de servicio (`backend:3000`).
#   - El frontend (nginx) actúa de reverse proxy: sirve el HTML/JS estático
#     y reenvía /api al backend. El navegador solo toca un puerto (el del
#     frontend) → sin CORS, sin configuración extra.
#   - El backend NO se publica al host (no tiene `ports:`): solo es
#     alcanzable dentro de la red Docker. Hardening por defecto.
#
# Configuración vía variables de entorno (ver .env.example en la raíz).
# ============================================================================

services:
  # ------------------ Backend: API REST (Node + Express) ------------------
  backend:
    build:
      context: ./backend
    # El backend no necesita publicarse al host; solo lo consume nginx.
    # (Para depurar puntualmente se podría añadir `ports: ["3000:3000"]`.)
    environment:
      - NODE_ENV=production
      # Puerto interno (red de Docker). Debe coincidir con EXPOSE del
      # Dockerfile, el proxy nginx (backend:3000) y el healthcheck.
      - PORT=3000
      # Servicios estáticos a monitorizar (formato nombre=url, comas).
      # Default: solo DNS públicos (Google + Cloudflare). NO incluimos el
      # gateway local para no exponer tu router a visitantes de la app.
      - MONITOR_SERVICES=${MONITOR_SERVICES:-google=https://dns.google,cloudflare=https://1.1.1.1}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-5000}
      - PROBES=${PROBES:-5}
    # Persistencia de los servicios agregados desde la interfaz (UI).
    volumes:
      - backend-data:/app/data
    networks:
      - monitor-net
    # Healthcheck: comprueba que la API responde antes de marcar el contenedor
    # como sano (nativa de Node, sin wget/curl extra).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

    # ===================== AISLAMIENTO / HARDENING DEL BACKEND =====================
    # Sistema de archivos de SOLO LECTURA: el backend no puede escribir en el
    # rootfs. Solo persiste en el volumen /app/data (services.json) y usa el
    # tmpfs /tmp para cualquier dato temporal.
    read_only: true
    tmpfs:
      - /tmp
    # Se DROP todas las capacidades de Linux (capabilities). El proceso solo
    # hace TCP client/server en puertos altos (>1024), que no requieren caps.
    cap_drop:
      - ALL
    # Evita escalada por binarios setuid/setgid dentro del contenedor.
    security_opt:
      - no-new-privileges:true
    # Tini como PID 1: reaps procesos huérfanos y gestiona señales en los
    # apagados (sin dejar zombies ni peticiones sin terminación limpia).
    init: true
    # Límite de procesos del contenedor: previene forks en bucle u huérfanos.
    pids_limit: 100
    # Margen para que el SIGTERM de `docker stop` cierre con gracia.
    stop_grace_period: 15s
    # Límite de memoria del contenedor backend (protección del host).
    deploy:
      resources:
        limits:
          memory: 256M

  # ------------------ Frontend: Astro estático + nginx ------------------
  frontend:
    build:
      context: ./frontend/public
      dockerfile: Dockerfile
      # Build args inyectados en la etapa `builder` del Dockerfile.
      # PUBLIC_API_BASE es el equivalente a NEXT_PUBLIC_API_URL: la URL de la
      # API vista desde el navegador (subdominio con Cloudflare Tunnel).
      # La app hoy usa ruta relativa /api (misma origin vía proxy nginx), pero
      # queda disponible en el entorno de build por si hiciera falta
      # import.meta.env.PUBLIC_API_BASE.
      args:
        PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://homelab-monitor.acevedojavier.dev/api}
    # ÚNICO puerto publicado hacia el host: la puerta de entrada web.
    # El proxy /api de nginx redirige internamente al backend.
    # El default 4321 coincide con la ruta configurada en Cloudflare Tunnel.
    # 8080 = puerto interno de nginx (non-root); 4321 = puerto del host.
    ports:
      - "${FRONTEND_PORT:-4321}:8080"
    # Límite explícito de memoria del contenedor (máximo 2 GB, 2048M).
    # Protege al servidor local frente a picos de RAM del proceso nginx y
    # garantiza que el contenedor nunca consuma más de lo asignado.
    deploy:
      resources:
        limits:
          memory: 2048M
    depends_on:
      - backend
    networks:
      - monitor-net
    restart: unless-stopped

    # ===================== AISLAMIENTO / HARDENING DEL FRONTEND =====================
    # nginx ya corre como usuario no-root (nodejs, uid 1001).
    # Sin capacidades de Linux (nginx solo sirve estático y proxya a 8080).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 100
    stop_grace_period: 15s
    # Nota: se omite read_only aquí a propósito: nginx (no-root) necesita
    # escribir /var/log/nginx y /var/cache/nginx, que un tmpfs de compose no
    # puede ceder a un usuario no-root sin romperlo. El resto de hardening
    # (sin caps, sin suid, init, límites) cubre la superficie de riesgo.

networks:
  # Red interna privada (bridge por defecto)
  monitor-net:
    driver: bridge

volumes:
  # Volumen nombrado: sobrevive a `docker compose down` (no a `down -v`).
  backend-data:
