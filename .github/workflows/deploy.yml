name: CI/CD Pipeline - Home Lab Monitor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Forzar el motor de executor de GitHub Actions a Node 24
# (Node 20 quedó EOL en abril 2026 y sin soporte en la plataforma)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # JOB 1: Verificación de sintaxis y calidad de Docker Compose
  quality-check:
    name: Calidad del código y verificación de la compilación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            docker-compose.yaml

      - name: Validar Sintaxis de Docker Compose
        run: |
          docker compose config

  # JOB 2: Despliegue seguro vía Cloudflare Tunnel (SSH Nativo)
  deploy:
    name: Implementar en el servidor de producción
    needs: quality-check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Instalar Cloudflare CLI (cloudflared)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Configurar llaves y cliente SSH con ProxyCommand
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Guardar la llave privada de despliegue desde los secretos de GitHub
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configurar la regla SSH para enrutar a través de cloudflared
          cat <<'EOF' > ~/.ssh/config
          Host production-server
              HostName ${{ secrets.SERVER_HOST }}
              User ${{ secrets.SERVER_USER }}
              Port ${{ secrets.SERVER_PORT }}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Ejecutar despliegue vía SSH en el servidor
        run: |
          ssh production-server << 'EOF'
            set -e
            cd /opt/homelab-monitor
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f
          EOF
