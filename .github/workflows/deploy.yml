name: CI/CD Pipeline - HomeLab_Monitor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Garantizar el uso del runtime actualizado en los runners de GitHub
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # 1. Fase de Verificación de Calidad del Código y Construcción
  quality-check:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4.2.2

      - name: Validar Sintaxis de Docker Compose
        run: |
          docker compose config

  # 2. Fase de Despliegue en Servidor Producción a travéz de Cloudflare Tunnel
  deploy:
    name: Deploy to Production Home Server
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4.2.2

      # Instalar la CLI oficial de cloudflared en el Runner temporal de GitHub
      - name: Instalar Cloudflare CLI (cloudflared)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      # Iniciar sesión SSH encapsulando el tráfico a través del túnel de Cloudflare
      - name: Desplegar en Servidor vía SSH sobre Cloudflare Tunnel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # Inyección del ProxyCommand utilizando cloudflared para atravesar el Zero Trust Tunnel
          proxy_host: ${{ secrets.SERVER_HOST }}
          proxy_username: ${{ secrets.SERVER_USER }}
          proxy_key: ${{ secrets.SERVER_SSH_KEY }}
          proxy_port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. Navegar a la ruta física exacta del sistema (/opt/homelab-monitor)
            cd /opt/homelab-monitor
            
            # 2. Obtener los cambios más recientes desde la rama main en GitHub
            git pull origin main
            
            # 3. Detener y remover la pila de contenedores anterior
            docker compose down
            
            # 4. Reconstruir la imagen de Docker con el código actualizado y levantar en segundo plano
            docker compose up -d --build
            
            # 5. Limpiar imágenes de Docker huérfanas para optimizar el almacenamiento del disco
            docker image prune -f