name: CI/CD Pipeline - HomeLab_Monitor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Fase de Verificación y Compilación
  quality-check:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Validar Sintaxis de Docker Compose
        run: |
          docker compose config

  # 2. Fase de Despliegue en Servidor Producción
  deploy:
    name: Deploy to Production Home Server
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Desplegar en Servidor vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. Navegar a la ruta física exacta del sistema (/opt/homelab-monitor)
            cd /opt/homelab-monitor
            
            # 2. Obtener los cambios más recientes desde la rama main en GitHub
            git pull origin main
            
            # 3. Detener y remover la pila de contenedores anterior
            docker compose down
            
            # 4. Reconstruir la imagen de Docker con el código actualizado y levantar en segundo plano
            docker compose up -d --build
            
            # 5. Limpiar imágenes de Docker huérfanas para optimizar el almacenamiento del disco
            docker image prune -f