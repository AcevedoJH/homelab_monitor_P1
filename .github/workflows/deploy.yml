name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Definición de variables de entorno globales
env:
  # Forzar el motor de ejecución de GitHub Actions a Node 24 (Previene deprecación de Node 20)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"

jobs:
  quality-check:
    name: Code Audit & Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Astro Typecheck & Validation
        run: npx astro check || echo "Skipping typecheck if not configured"

      - name: Dry-Run Build Verification
        run: npm run build

  deploy:
    name: Secure SSH Deployment via Cloudflare Tunnel
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Self-Hosted Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /opt/portfolio-astro
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f